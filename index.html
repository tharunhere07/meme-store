
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0;
    }

    img, video {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="gallery">
    <a href="Screenshot%202026-10-02%20224802.png">
      <img src="Screenshot%202026-10-02%20224802.png" alt="">
    </a>
  </div>
</body>
</html>
